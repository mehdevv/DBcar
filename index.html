<title>Véhicules Algérie — Base de données</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg: #0d0f0e;
    --surface: #141614;
    --surface2: #1c1f1c;
    --border: #2a2e2a;
    --border2: #363a36;
    --accent: #b8f04a;
    --accent-dim: #8ab535;
    --text: #e8ede8;
    --text2: #8a9488;
    --text3: #5a6058;
    --cat-voitures: #4af0a8;
    --cat-suv: #f0a84a;
    --cat-util: #a84af0;
    --cat-other: #f04a7a;
    --radius: 10px;
    --radius-lg: 16px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  /* ── Header ── */
  header {
    padding: 48px 40px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-left h1 {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--text);
    line-height: 1;
  }
  .header-left h1 span { color: var(--accent); }
  .header-left p {
    margin-top: 8px;
    font-size: 13px;
    color: var(--text2);
    font-family: 'DM Mono', monospace;
  }
  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .stat {
    text-align: right;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  .stat-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  /* ── Controls ── */
  .controls {
    padding: 24px 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(13,15,14,0.96);
    backdrop-filter: blur(12px);
    z-index: 100;
  }

  .search-wrap {
    flex: 1;
    min-width: 240px;
    position: relative;
  }
  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 14px;
    pointer-events: none;
  }
  input[type="search"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px 10px 38px;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }
  input[type="search"]:focus { border-color: var(--accent); }
  input[type="search"]::placeholder { color: var(--text3); }

  .filter-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .pill:hover { border-color: var(--accent-dim); color: var(--text); }
  .pill.active { background: var(--accent); color: #0d0f0e; border-color: var(--accent); }

  .view-toggle {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
  }
  .view-btn {
    padding: 6px 10px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  .view-btn.active { background: var(--border2); color: var(--text); }

  /* ── Result count ── */
  .result-bar {
    padding: 12px 40px;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
  }
  .result-bar span { color: var(--accent); }

  /* ── Main grid ── */
  .main {
    padding: 32px 40px;
  }

  /* ── Category section ── */
  .category-section {
    margin-bottom: 48px;
  }
  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .category-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .category-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .category-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    padding: 3px 8px;
    background: var(--surface2);
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  /* ── Brand block ── */
  .brands-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }

  .brand-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .brand-card:hover { border-color: var(--border2); }

  .brand-header {
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
  }
  .brand-header:hover .brand-name { color: var(--accent); }
  .brand-name {
    font-size: 15px;
    font-weight: 700;
    transition: color 0.15s;
  }
  .brand-meta {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .model-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text3);
  }
  .chevron {
    color: var(--text3);
    font-size: 10px;
    transition: transform 0.2s;
  }
  .brand-card.open .chevron { transform: rotate(180deg); }

  .models-list {
    display: none;
    padding: 4px 0;
  }
  .brand-card.open .models-list { display: block; }

  .model-row {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .model-row:last-child { border-bottom: none; }
  .model-row:hover { background: var(--surface2); }

  .model-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }
  .engines-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .engine-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }
  .engine-dot {
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent-dim);
    flex-shrink: 0;
  }

  /* ── Table view ── */
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead tr {
    border-bottom: 1px solid var(--border2);
  }
  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
    background: var(--surface);
  }
  td {
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--surface2); }

  .cat-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 600;
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.04em;
  }
  .engine-mono {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    color: var(--text2);
  }

  /* ── Hidden / visible ── */
  .hidden { display: none !important; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-text { font-size: 15px; }

  @media (max-width: 600px) {
    header, .controls, .main, .result-bar { padding-left: 20px; padding-right: 20px; }
    .stats { gap: 12px; }
  }
</style>

// Build lookup maps
const catMap = Object.fromEntries(DB.categories.map(c => [c.id, c]));
const brandMap = Object.fromEntries(DB.brands.map(b => [b.id, b]));
const modelMap = Object.fromEntries(DB.models.map(m => [m.id, m]));

// Enrich: attach engines to models, models to brands, brands to categories
DB.models.forEach(m => { m.engines = []; });
DB.engines.forEach(e => {
  const m = modelMap[e.model];
  if (m) m.engines.push(e);
});
DB.brands.forEach(b => {
  b.models = DB.models.filter(m => m.brand === b.id);
  b.category = catMap[b.cat];
});
DB.categories.forEach(c => {
  c.brands = DB.brands.filter(b => b.cat === c.id);
});

let activeCat = 'all';
let searchQuery = '';
let viewMode = 'cards';

function enginesCount(brands) {
  return brands.reduce((sum, b) => sum + b.models.reduce((s2, m) => s2 + m.engines.length, 0), 0);
}

function matches(str, q) {
  return str.toLowerCase().includes(q.toLowerCase());
}

function filterBrand(brand, q, cat) {
  if (cat !== 'all' && brand.cat !== cat) return false;
  if (!q) return true;
  if (matches(brand.name, q)) return true;
  return brand.models.some(m =>
    matches(m.name, q) || m.engines.some(e => matches(e.label, q))
  );
}

function filterModel(model, q) {
  if (!q) return true;
  const brand = brandMap[model.brand];
  if (matches(model.name, q)) return true;
  if (brand && matches(brand.name, q)) return true;
  return model.engines.some(e => matches(e.label, q));
}

function renderCards() {
  const container = document.getElementById('cardsView');
  const q = searchQuery;
  const cat = activeCat;

  let totalEngines = 0;
  let html = '';

  DB.categories.forEach(c => {
    if (cat !== 'all' && cat !== c.id) return;

    const visibleBrands = c.brands.filter(b => filterBrand(b, q, 'all'));
    if (!visibleBrands.length) return;

    const brandCount = visibleBrands.length;
    const engCount = enginesCount(visibleBrands);
    totalEngines += engCount;

    html += `<div class="category-section" data-cat="${c.id}">
      <div class="category-header">
        <div class="category-dot" style="background:${c.color}"></div>
        <div class="category-title" style="color:${c.color}">${c.name}</div>
        <div class="category-count">${brandCount} marques · ${engCount} motorisations</div>
      </div>
      <div class="brands-grid">`;

    visibleBrands.forEach(brand => {
      const visibleModels = brand.models.filter(m => filterModel(m, q));
      if (!visibleModels.length) return;

      const modCount = visibleModels.length;
      const engCount2 = visibleModels.reduce((s, m) => s + m.engines.length, 0);

      html += `<div class="brand-card" onclick="this.classList.toggle('open')">
        <div class="brand-header">
          <div class="brand-name">${brand.name}</div>
          <div class="brand-meta">
            <span class="model-count">${modCount} modèle${modCount>1?'s':''} · ${engCount2} moteur${engCount2>1?'s':''}</span>
            <span class="chevron">▼</span>
          </div>
        </div>
        <div class="models-list">`;

      visibleModels.forEach(model => {
        html += `<div class="model-row">
          <div class="model-name">${model.name}</div>
          <div class="engines-list">`;
        model.engines.forEach(e => {
          html += `<div class="engine-tag"><span class="engine-dot"></span>${e.label}</div>`;
        });
        html += `</div></div>`;
      });

      html += `</div></div>`;
    });

    html += `</div></div>`;
  });

  if (!html) {
    html = `<div class="empty">
      <div class="empty-icon">○</div>
      <div class="empty-text">Aucun résultat pour "${q}"</div>
    </div>`;
  }

  container.innerHTML = html;
  document.getElementById('resultCount').textContent = totalEngines;
}

function renderTable() {
  const container = document.getElementById('tableView');
  const q = searchQuery;
  const cat = activeCat;

  let rows = '';
  let count = 0;

  DB.engines.forEach(e => {
    const model = modelMap[e.model];
    if (!model) return;
    const brand = brandMap[model.brand];
    if (!brand) return;
    const category = catMap[brand.cat];
    if (!category) return;

    if (cat !== 'all' && brand.cat !== cat) return;

    if (q) {
      const haystack = [brand.name, model.name, e.label, category.name].join(' ');
      if (!matches(haystack, q)) return;
    }

    count++;
    rows += `<tr>
      <td><span class="cat-badge" style="background:${category.color}22;color:${category.color}">${category.name}</span></td>
      <td style="font-weight:600">${brand.name}</td>
      <td>${model.name}</td>
      <td class="engine-mono">${e.label}</td>
      <td style="font-family:'DM Mono',monospace;font-size:12px;color:var(--text3)">${e.year}</td>
    </tr>`;
  });

  if (!rows) {
    rows = `<tr><td colspan="5" style="text-align:center;padding:60px 20px;color:var(--text3)">Aucun résultat pour "${q}"</td></tr>`;
  }

  container.innerHTML = `<div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Catégorie</th>
          <th>Marque</th>
          <th>Modèle</th>
          <th>Motorisation</th>
          <th>Année</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;

  document.getElementById('resultCount').textContent = count;
}

function render() {
  if (viewMode === 'cards') {
    renderCards();
    document.getElementById('cardsView').classList.remove('hidden');
    document.getElementById('tableView').classList.add('hidden');
  } else {
    renderTable();
    document.getElementById('tableView').classList.remove('hidden');
    document.getElementById('cardsView').classList.add('hidden');
  }
}

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

// Category pills
document.getElementById('filterPills').addEventListener('click', e => {
  const pill = e.target.closest('.pill');
  if (!pill) return;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  pill.classList.add('active');
  activeCat = pill.dataset.cat;
  render();
});

// View toggle
document.getElementById('btnCards').addEventListener('click', () => {
  viewMode = 'cards';
  document.getElementById('btnCards').classList.add('active');
  document.getElementById('btnTable').classList.remove('active');
  render();
});
document.getElementById('btnTable').addEventListener('click', () => {
  viewMode = 'table';
  document.getElementById('btnTable').classList.add('active');
  document.getElementById('btnCards').classList.remove('active');
  render();
});

render();
</script>
